<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Idle Developers 3D — Office</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-top: #f0dcc6;
    --bg-bottom: #b88f70;
    --panel: rgba(255, 255, 255, 0.86);
    --text: #1d2733;
    --muted: #566273;
    --line: rgba(20, 30, 45, 0.12);
    --btn: #ffffff;
    --btn-hover: #eef2f7;
    --focus: #2f6fdb;
    --bubble-bg: #fffaf2;
    --money: #1f7a3a;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg-top: #3b2b22;
      --bg-bottom: #140e0b;
      --panel: rgba(24, 31, 42, 0.86);
      --text: #e6ebf2;
      --muted: #9aa6b6;
      --line: rgba(255, 255, 255, 0.1);
      --btn: #222c3a;
      --btn-hover: #2c3848;
      --focus: #7aa7ff;
      --bubble-bg: #2b221c;
      --money: #7ad694;
      --buy-text: #10351d;
    }
  }
  :root[data-theme="dark"] {
    --bg-top: #3b2b22;
    --bg-bottom: #140e0b;
    --panel: rgba(24, 31, 42, 0.86);
    --text: #e6ebf2;
    --muted: #9aa6b6;
    --line: rgba(255, 255, 255, 0.1);
    --btn: #222c3a;
    --btn-hover: #2c3848;
    --focus: #7aa7ff;
    --bubble-bg: #2b221c;
    --money: #7ad694;
    --buy-text: #10351d;
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
    color: var(--text);
    font-family: "Nunito", "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-user-select: none;
    user-select: none;
  }
  #stage {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    touch-action: none;
    cursor: grab;
  }
  #stage.dragging { cursor: grabbing; }
  .vignette {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none;
    background: radial-gradient(ellipse at 50% 50%, rgba(0, 0, 0, 0) 55%, rgba(60, 30, 10, 0.28) 100%);
  }
  #stage canvas { display: block; width: 100%; height: 100%; outline: none; }

  .title {
    position: fixed;
    top: 0;
    left: 0;
    padding: calc(14px + env(safe-area-inset-top, 0px)) 16px 0 16px;
    pointer-events: none;
  }
  .title h1 {
    margin: 0;
    font-family: "Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
    font-weight: 400;
    font-size: 24px;
    letter-spacing: 0.02em;
    color: #ffffff;
    text-shadow: -2px -2px 0 #2a1a10, 2px -2px 0 #2a1a10, -2px 2px 0 #2a1a10, 2px 2px 0 #2a1a10, 0 4px 0 #2a1a10;
  }
  .title p {
    display: inline-block;
    margin: 6px 0 0;
    padding: 2px 10px;
    border: 2px solid #2a1a10;
    border-radius: 999px;
    background: #4a2d1b;
    box-shadow: 0 2px 0 #2a1a10;
    font-size: 12px;
    font-weight: 900;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #f0c98e;
  }

  .controls {
    position: fixed;
    right: 0;
    bottom: 0;
    padding: 0 14px calc(14px + env(safe-area-inset-bottom, 0px)) 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .controls button {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    border: 3px solid #2a1a10;
    background: linear-gradient(180deg, #6a4128 0%, #4a2d1b 50%, #37210f 100%);
    box-shadow: 0 4px 0 #2a1a10, inset 0 2px 0 rgba(255, 255, 255, 0.18);
    color: #fff3dc;
    font-size: 22px;
    font-weight: 900;
    line-height: 1;
    cursor: pointer;
  }
  .controls button:hover { filter: brightness(1.1); }
  .controls button:active { transform: translateY(3px); box-shadow: 0 1px 0 #2a1a10; }

  .hint {
    position: fixed;
    left: 0;
    bottom: 0;
    padding: 0 0 calc(14px + env(safe-area-inset-bottom, 0px)) 14px;
    max-width: calc(100% - 80px);
    pointer-events: none;
  }
  .hint span {
    display: inline-block;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 7px 11px;
    font-size: 12.5px;
    color: var(--muted);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }
  .bubble-wrap {
    position: fixed;
    top: 0;
    left: 0;
    z-index: 5;
    will-change: transform;
  }
  .bubble-wrap[hidden] { display: none; }
  .bubble {
    --tail: 0px;
    position: relative;
    width: min(290px, calc(100vw - 32px));
    background: var(--bubble-bg);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 12px 14px 14px;
    box-shadow: 0 10px 28px rgba(60, 30, 10, 0.22);
    transform-origin: 50% 100%;
    animation: bubble-in 180ms ease-out;
  }
  .bubble::after {
    content: "";
    position: absolute;
    left: calc(50% + var(--tail));
    bottom: -9px;
    width: 16px;
    height: 16px;
    margin-left: -8px;
    background: var(--bubble-bg);
    border-right: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    transform: rotate(45deg);
  }
  @keyframes bubble-in {
    from { opacity: 0; transform: translateY(6px) scale(0.94); }
    to { opacity: 1; transform: none; }
  }
  .bubble.angry { border: 2px solid #c0392b; animation: bubble-in 180ms ease-out, bubble-shake 380ms 180ms ease-in-out; }
  .bubble.angry::after { border-right: 2px solid #c0392b; border-bottom: 2px solid #c0392b; }
  .bubble.angry p { font-weight: 650; }
  @keyframes bubble-shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-5px) rotate(-1deg); }
    40% { transform: translateX(5px) rotate(1deg); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(3px); }
  }
  @media (prefers-reduced-motion: reduce) { .bubble, .bubble.angry { animation: none; } }
  .bubble-head { display: flex; align-items: flex-start; gap: 10px; }
  .who { flex: 1; min-width: 0; }
  .who strong { display: block; font-size: 15px; line-height: 1.2; }
  .role {
    display: inline-block;
    margin-top: 4px;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 11.5px;
    font-weight: 600;
    color: #ffffff;
  }
  .bubble p { margin: 10px 0 0; font-size: 14px; line-height: 1.45; }
  .close {
    flex: none;
    width: 30px;
    height: 30px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--btn);
    color: var(--text);
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
  }
  .close:hover { background: var(--btn-hover); }
  .close:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .shout {
    position: fixed;
    top: 0;
    left: 0;
    z-index: 4;
    max-width: 210px;
    padding: 6px 10px;
    border-radius: 12px;
    background: var(--bubble-bg);
    color: var(--text);
    border: 1px solid var(--line);
    box-shadow: 0 6px 16px rgba(60, 30, 10, 0.2);
    font-size: 13px;
    line-height: 1.3;
    pointer-events: none;
    white-space: normal;
    animation: shout-in 150ms ease-out;
  }
  .shout::after {
    content: "";
    position: absolute;
    left: 50%;
    bottom: -6px;
    width: 10px;
    height: 10px;
    margin-left: -5px;
    background: var(--bubble-bg);
    border-right: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    transform: rotate(45deg);
  }
  .shout.burn { border: 2px solid #e76f51; font-weight: 700; color: #c2410c; }
  .shout.burn::after { border-right: 2px solid #e76f51; border-bottom: 2px solid #e76f51; }
  .shout.ceo { border: 2px solid #c0392b; font-weight: 700; color: #b3261e; font-size: 14px; }
  .shout.ceo::after { border-right: 2px solid #c0392b; border-bottom: 2px solid #c0392b; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .shout.ceo { color: #ff8a80; } }
  :root[data-theme="dark"] .shout.ceo { color: #ff8a80; }
  @keyframes shout-in { from { opacity: 0; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .shout { animation: none; } }
  /* ================= Game HUD ================= */
  :root {
    --g-ink: #2a1a10;
    --g-panel: #4a2d1b;
    --g-panel-2: #37210f;
    --g-cream: #fff3dc;
    --g-tan: #f0c98e;
    --g-gold: #ffc93c;
    --g-green: #5fd96f;
    --g-font: "Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  }
  .outline {
    text-shadow:
      -2px -2px 0 var(--g-ink), 2px -2px 0 var(--g-ink), -2px 2px 0 var(--g-ink), 2px 2px 0 var(--g-ink),
      0 -2px 0 var(--g-ink), 0 2px 0 var(--g-ink), -2px 0 0 var(--g-ink), 2px 0 0 var(--g-ink),
      0 4px 0 var(--g-ink);
  }
  .hud {
    position: fixed;
    top: 0;
    right: 0;
    width: 212px;
    padding: calc(12px + env(safe-area-inset-top, 0px)) 14px 0 0;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 8px;
    pointer-events: none;
    font-family: var(--g-font);
  }
  .hud > * { pointer-events: auto; }

  .coinbar {
    position: relative;
    display: flex;
    align-items: center;
    height: 46px;
    padding: 0 16px 0 50px;
    border: 3px solid var(--g-ink);
    border-radius: 999px;
    background: linear-gradient(180deg, #6a4128 0%, var(--g-panel) 45%, var(--g-panel-2) 100%);
    box-shadow: 0 4px 0 var(--g-ink), inset 0 2px 0 rgba(255, 255, 255, 0.18);
    color: #ffffff;
    cursor: pointer;
    font: inherit;
    transition: transform 80ms ease;
  }
  .coinbar:hover { transform: translateY(-1px); }
  .coinbar:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--g-ink), inset 0 2px 0 rgba(255, 255, 255, 0.18); }
  .coinbar:focus-visible, .upg-btn:focus-visible, .buy:focus-visible, .g-close:focus-visible, .controls button:focus-visible {
    outline: 3px solid #7ab8ff;
    outline-offset: 3px;
  }
  .coin {
    position: absolute;
    left: -6px;
    top: 50%;
    width: 48px;
    height: 48px;
    margin-top: -24px;
    border-radius: 50%;
    border: 3px solid var(--g-ink);
    background: radial-gradient(circle at 35% 30%, #fff4b8 0%, #ffd84d 30%, #f5a623 75%, #d9850a 100%);
    box-shadow: inset 0 -4px 0 rgba(160, 80, 0, 0.45), inset 0 3px 0 rgba(255, 255, 255, 0.5), 0 3px 0 var(--g-ink);
    display: grid;
    place-items: center;
  }
  .coin::before {
    content: "";
    position: absolute;
    inset: 5px;
    border-radius: 50%;
    border: 2px solid rgba(170, 90, 0, 0.55);
  }
  .coin span { position: relative; font-size: 24px; color: #a85c00; text-shadow: 0 2px 0 rgba(255, 240, 180, 0.8); line-height: 1; }
  .coin.sm { position: relative; left: auto; top: auto; width: 18px; height: 18px; margin: 0; border-width: 2px; box-shadow: inset 0 -2px 0 rgba(160, 80, 0, 0.45); }
  .coin.sm::before { display: none; }
  .coin.spin { animation: coin-flip 600ms ease-out; }
  @keyframes coin-flip { from { transform: rotateY(0) scale(1.15); } to { transform: rotateY(360deg) scale(1); } }
  .cash {
    flex: 1;
    text-align: right;
    font-size: 27px;
    line-height: 1;
    letter-spacing: 0.02em;
    color: #ffffff;
    font-variant-numeric: tabular-nums;
    transform-origin: 100% 50%;
  }
  .cash.bump { animation: cash-bump 420ms ease-out; }
  @keyframes cash-bump { 0% { transform: scale(1); color: #ffffff; } 30% { transform: scale(1.18); color: var(--g-gold); } 100% { transform: scale(1); color: #ffffff; } }

  .hud-row { display: flex; justify-content: flex-end; gap: 6px; pointer-events: none; }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    height: 26px;
    padding: 0 10px;
    border: 2px solid var(--g-ink);
    border-radius: 999px;
    background: rgba(42, 26, 16, 0.88);
    box-shadow: 0 3px 0 var(--g-ink);
    color: var(--g-cream);
    font-size: 15px;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .badge.income b { font-weight: 400; color: var(--g-green); }
  .badge.income .up { color: var(--g-green); font-size: 11px; }
  .badge small { font-family: "Nunito", system-ui, sans-serif; font-weight: 900; font-size: 11px; color: var(--g-tan); }
  .badge svg { width: 14px; height: 14px; fill: var(--g-tan); }

  .payday {
    position: relative;
    height: 22px;
    border: 3px solid var(--g-ink);
    border-radius: 999px;
    background: #24160c;
    box-shadow: 0 3px 0 var(--g-ink), inset 0 3px 0 rgba(0, 0, 0, 0.35);
    overflow: hidden;
    pointer-events: none;
  }
  .payday i {
    display: block;
    height: 100%;
    width: 0;
    border-radius: 999px;
    background:
      repeating-linear-gradient(135deg, rgba(255, 255, 255, 0.22) 0 7px, rgba(255, 255, 255, 0) 7px 14px),
      linear-gradient(180deg, #ffe066 0%, #ffb627 55%, #f08c00 100%);
    background-size: 20px 20px, 100% 100%;
    animation: stripes 900ms linear infinite;
  }
  @keyframes stripes { from { background-position: 0 0, 0 0; } to { background-position: 20px 0, 0 0; } }
  .payday span {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    font-size: 12.5px;
    letter-spacing: 0.08em;
    color: #ffffff;
    text-shadow: -1px -1px 0 var(--g-ink), 1px -1px 0 var(--g-ink), -1px 1px 0 var(--g-ink), 1px 1px 0 var(--g-ink), 0 2px 0 var(--g-ink);
  }

  .upg-btn {
    position: relative;
    height: 44px;
    border: 3px solid var(--g-ink);
    border-radius: 14px;
    background: linear-gradient(180deg, #ffd166 0%, #ffab2e 50%, #ff8a1f 100%);
    box-shadow: 0 5px 0 var(--g-ink), inset 0 3px 0 rgba(255, 255, 255, 0.45), inset 0 -3px 0 rgba(180, 70, 0, 0.35);
    color: #ffffff;
    font: inherit;
    font-size: 19px;
    letter-spacing: 0.06em;
    cursor: pointer;
    transition: transform 80ms ease, filter 120ms ease;
  }
  .upg-btn:hover { filter: brightness(1.06); transform: translateY(-1px); }
  .upg-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--g-ink), inset 0 3px 0 rgba(255, 255, 255, 0.45); }
  .upg-btn .dot {
    display: none;
    position: absolute;
    top: -10px;
    right: -8px;
    min-width: 24px;
    height: 24px;
    padding: 0 6px;
    border: 3px solid var(--g-ink);
    border-radius: 999px;
    background: #ff4d4d;
    color: #ffffff;
    font-size: 14px;
    line-height: 18px;
    text-shadow: none;
  }
  .upg-btn.ready .dot { display: block; animation: dot-bounce 1.2s ease-in-out infinite; }
  @keyframes dot-bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }

  /* ---- burnout ring over heads ---- */
  .chip {
    position: fixed;
    top: 0;
    left: 0;
    z-index: 3;
    width: 26px;
    height: 26px;
    padding: 2px;
    border-radius: 50%;
    border: 2px solid var(--g-ink);
    background: rgba(42, 26, 16, 0.85);
    pointer-events: none;
    transition: box-shadow 150ms ease;
  }
  .chip svg { display: block; width: 100%; height: 100%; transform: rotate(-90deg); }
  .chip .trk { fill: none; stroke: rgba(255, 243, 220, 0.18); stroke-width: 3.5; }
  .chip .val { fill: none; stroke: var(--g-green); stroke-width: 3.5; stroke-linecap: round; stroke-dasharray: 47.12; }
  .chip.warn .val { stroke: var(--g-gold); }
  .chip.hot .val { stroke: #ff4d4d; }
  .chip.focus { box-shadow: 0 0 0 3px rgba(255, 170, 40, 0.75), 0 0 12px rgba(255, 170, 40, 0.8); }
  .chip.off { opacity: 0.7; }

  /* ---- floating money ---- */
  .pop {
    position: fixed;
    z-index: 6;
    pointer-events: none;
    font-family: var(--g-font);
    font-size: 19px;
    color: var(--g-gold);
    white-space: nowrap;
    text-shadow: -2px -2px 0 var(--g-ink), 2px -2px 0 var(--g-ink), -2px 2px 0 var(--g-ink), 2px 2px 0 var(--g-ink), 0 3px 0 var(--g-ink);
    transform: translate(-50%, -50%);
    animation: pop-rise 0.9s ease-out forwards;
  }
  .pop.click { font-size: 24px; color: #ffffff; }
  .pop.payday { font-size: 28px; color: var(--g-green); animation-duration: 1.1s; }
  .pop.note {
    font-family: "Nunito", system-ui, sans-serif;
    font-weight: 800;
    font-size: 13px;
    color: var(--g-cream);
    background: var(--g-panel);
    border: 2px solid var(--g-ink);
    box-shadow: 0 3px 0 var(--g-ink);
    border-radius: 10px;
    padding: 5px 10px;
    text-shadow: none;
    animation: pop-note 1.6s ease-out forwards;
  }
  @keyframes pop-rise {
    0% { opacity: 0; transform: translate(-50%, -30%) scale(0.6); }
    15% { opacity: 1; transform: translate(-50%, -50%) scale(1.15); }
    30% { transform: translate(-50%, -55%) scale(1); }
    100% { opacity: 0; transform: translate(-50%, calc(-50% - 46px)) scale(1); }
  }
  @keyframes pop-note {
    0% { opacity: 0; transform: translate(-50%, -30%); }
    12% { opacity: 1; transform: translate(-50%, -50%); }
    80% { opacity: 1; }
    100% { opacity: 0; transform: translate(-50%, -80%); }
  }

  /* ---- upgrades shop ---- */
  .shop {
    position: fixed;
    top: calc(var(--hud-bottom, 210px) + 12px);
    right: 14px;
    z-index: 8;
    width: min(360px, calc(100vw - 28px));
    max-height: calc(100% - var(--hud-bottom, 210px) - 26px - env(safe-area-inset-bottom, 0px));
    overflow: auto;
    border: 3px solid var(--g-ink);
    border-radius: 18px;
    background: linear-gradient(180deg, #52321e 0%, #3a2314 100%);
    box-shadow: 0 6px 0 var(--g-ink), 0 20px 40px rgba(0, 0, 0, 0.35);
    color: var(--g-cream);
    font-family: "Nunito", system-ui, sans-serif;
    animation: shop-in 180ms cubic-bezier(0.2, 1.4, 0.4, 1);
    transform-origin: 100% 0;
  }
  .shop[hidden] { display: none; }
  @keyframes shop-in { from { opacity: 0; transform: scale(0.9) translateY(-8px); } to { opacity: 1; transform: none; } }
  .shop-head {
    position: sticky;
    top: 0;
    z-index: 1;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 12px 12px 16px;
    background: #2f1c10;
    border-bottom: 3px solid var(--g-ink);
  }
  .shop-head h2 { flex: 1; margin: 0; font-family: var(--g-font); font-weight: 400; font-size: 23px; letter-spacing: 0.03em; color: #ffffff; }
  .shop-head .have {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: var(--g-font);
    font-size: 17px;
    color: var(--g-gold);
  }
  .g-close {
    flex: none;
    width: 34px;
    height: 34px;
    border: 3px solid var(--g-ink);
    border-radius: 10px;
    background: linear-gradient(180deg, #ff7a6b 0%, #e0453a 100%);
    box-shadow: 0 3px 0 var(--g-ink);
    color: #ffffff;
    font: 400 20px/1 var(--g-font);
    cursor: pointer;
  }
  .g-close:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--g-ink); }
  .shop h3 {
    margin: 16px 16px 8px;
    font-family: var(--g-font);
    font-weight: 400;
    font-size: 14px;
    letter-spacing: 0.1em;
    color: var(--g-tan);
  }
  .card {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 0 12px 10px;
    padding: 10px;
    border: 3px solid var(--g-ink);
    border-radius: 14px;
    background: #5c3a23;
    box-shadow: 0 3px 0 var(--g-ink), inset 0 2px 0 rgba(255, 255, 255, 0.08);
  }
  .card .ic {
    flex: none;
    width: 46px;
    height: 46px;
    display: grid;
    place-items: center;
    font-size: 25px;
    border: 3px solid var(--g-ink);
    border-radius: 12px;

  }
  .card .info { flex: 1; min-width: 0; }

  .card .d { font-size: 12px; font-weight: 700; line-height: 1.35; color: #ecd6b6; }

  .buy {

    color: #ffffff;
    font: 400 16px/1 var(--g-font);
    text-shadow: -1px -1px 0 var(--g-ink), 1px -1px 0 var(--g-ink), -1px 1px 0 var(--g-ink), 1px 1px 0 var(--g-ink), 0 2px 0 var(--g-ink);

  }
  .buy:hover:not(:disabled) { filter: brightness(1.06); }
  .buy:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--g-ink), inset 0 2px 0 rgba(255, 255, 255, 0.45); }

  @media (prefers-reduced-motion: reduce) {
    .pop, .pop.note, .shop, .coin.spin, .cash.bump, .upg-btn.ready .dot, .payday i { animation: none; }
  }
  @media (max-width: 420px) {

    .cash { font-size: 23px; }
  }
  .error {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    max-width: 90%; text-align: center; font-size: 15px;
  }
</style>

<body>
<div id="stage" aria-label="Isometric office view. Drag to pan, scroll or pinch to zoom."></div>
<div class="vignette"></div>

<div class="title">
  <h1>Idle Developers 3D</h1>
  <p>Office</p>
</div>

<div class="controls">
  <button id="zoomIn" type="button" aria-label="Zoom in" title="Zoom in">+</button>
  <button id="zoomOut" type="button" aria-label="Zoom out" title="Zoom out">&minus;</button>
  <button id="reset" type="button" aria-label="Reset view" title="Reset view">&#8634;</button>
</div>

<div class="hint"><span id="hintText">Click a busy computer to earn faster. Click an empty desk to call its owner. Click a person to chat.</span></div>

<div class="hud">
  <button class="coinbar" id="walletBtn" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="shop" aria-label="Cash. Open upgrades">
    <span class="coin" id="coinIcon" aria-hidden="true"><span>$</span></span>
    <span class="cash outline" id="cash">$0</span>
  </button>
  <div class="hud-row">
    <span class="badge income" title="Earnings per in-game hour"><span class="up" aria-hidden="true">&#9650;</span><b id="rate">$0</b><small>/HR</small></span>
    <span class="badge" title="People working right now">
      <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="4.5" r="3"></circle><path d="M2 15c0-3.6 2.7-6 6-6s6 2.4 6 6z"></path></svg>
      <span id="workers">0</span>
    </span>
  </div>
  <div class="payday" aria-hidden="true"><i id="tickBar"></i><span id="tickLabel">PAYDAY 10s</span></div>
  <button class="upg-btn outline" id="upgBtn" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="shop">
    UPGRADES<span class="dot" aria-hidden="true">!</span>
  </button>
</div>

<div class="shop" id="shop" role="dialog" aria-labelledby="shopTitle" hidden>
  <div class="shop-head">
    <h2 id="shopTitle">Upgrades</h2>
    <span class="have"><span class="coin sm" aria-hidden="true"></span><span id="shopCash">$0</span></span>
    <button class="g-close" id="shopClose" type="button" aria-label="Close upgrades">&times;</button>
  </div>
  <h3>OFFICE UPGRADES</h3>
  <div id="upgList"></div>
  <h3>HIRING</h3>
  <div id="hireBox"></div>
  <p class="shop-foot">New hires walk in through the front door and take a free desk.</p>
</div>
<div id="chipLayer"></div>
<div id="popLayer"></div>
<div id="shoutLayer" aria-live="polite"></div>
<div class="bubble-wrap" id="bubbleWrap" hidden>
  <div class="bubble" id="bubble" role="dialog" aria-labelledby="bName" aria-describedby="bText">
    <div class="bubble-head">
      <div class="who"><strong id="bName"></strong><span class="role" id="bRole"></span></div>
      <button class="close" id="bClose" type="button" aria-label="Close">&times;</button>
    </div>
    <p id="bText"></p>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  "use strict";

  var stage = document.getElementById("stage");

  function showError(msg) {
    var d = document.createElement("div");
    d.className = "error";
    d.textContent = msg;
    document.body.appendChild(d);
  }

  if (!window.THREE) {
    showError("The 3D engine couldn't load. Check your connection and reload the page.");
    return;
  }

  var renderer;
  try {
    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  } catch (err) {
    showError("Your browser couldn't start WebGL, which this scene needs. Try another browser or enable hardware acceleration.");
    return;
  }

  if (window.matchMedia && window.matchMedia("(pointer: coarse)").matches) {
    document.getElementById("hintText").textContent = "Tap a busy computer to earn faster. Tap an empty desk to call its owner. Tap a person to chat.";
  }

  // ---------- Renderer / scene ----------
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setClearColor(0x000000, 0);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  stage.appendChild(renderer.domElement);

  var scene = new THREE.Scene();

  // Office footprint (meters)
  var W = 30, D = 18, XMIN = -12, XMAX = 18, FLOOR_CX = (XMIN + XMAX) / 2, HX = 12, HZ = D / 2, WALL_H = 3;

  // Seeded random so the office looks the same every load
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rnd = mulberry32(20260924);
  function pick(arr) { return arr[Math.floor(rnd() * arr.length)]; }

  // ---------- Materials ----------
  function lin(hex) { return new THREE.Color(hex).convertSRGBToLinear(); }
  function std(color, rough, metal, extra) {
    var o = { color: lin(color), roughness: rough == null ? 0.8 : rough, metalness: metal || 0 };
    if (extra) for (var k in extra) o[k] = extra[k];
    if (o.emissive != null) o.emissive = lin(o.emissive);
    return new THREE.MeshStandardMaterial(o);
  }
  function glow(hex) { return new THREE.MeshBasicMaterial({ color: lin(hex), toneMapped: false }); }
  function screenMat(t) { return new THREE.MeshBasicMaterial({ map: t, toneMapped: false }); }
  var mat = {
    wall: std(0xf1ece3, 0.95),
    baseboard: std(0xcfc5b5, 0.8),
    floorEdge: std(0x6b5138, 0.9),
    carpet: std(0x55606e, 1),
    meetCarpet: std(0x4a5260, 1),
    rug: std(0xc9924f, 1),
    deskTop: std(0xd9b68a, 0.55),
    deskLeg: std(0xe8e9ec, 0.45, 0.2),
    metal: std(0x3b4048, 0.35, 0.7),
    steel: std(0xc7ccd3, 0.35, 0.6),
    plastic: std(0x1f2328, 0.45),
    plasticLight: std(0xdde0e5, 0.5),
    divider: std(0x86a394, 1),
    paper: std(0xfafafa, 0.9),
    pot: std(0xb8694a, 0.85),
    potWhite: std(0xeceae6, 0.7),
    soil: std(0x3b2a1e, 1),
    cabinet: std(0xf6f4f0, 0.6),
    counter: std(0x3a3d42, 0.4),
    frame: std(0x2e3238, 0.5, 0.3),
    sofa: std(0x3d5a80, 0.95),
    sofaCushion: std(0x46668f, 0.95),
    pillow: std(0xe9c46a, 0.95),
    wood: std(0x8a5a3b, 0.6),
    lampShade: std(0xfff1d0, 0.8, 0, { emissive: 0xffc070, emissiveIntensity: 1.2 }),
    bulb: glow(0xffd9a0),
    redLight: glow(0xff4b4b),
    greenLight: glow(0x4bff8a),
    glass: new THREE.MeshStandardMaterial({
      color: lin(0xc9e2f0), roughness: 0.1, metalness: 0.1,
      transparent: true, opacity: 0.22, depthWrite: false
    }),
    water: new THREE.MeshStandardMaterial({
      color: lin(0x7fc4ff), roughness: 0.1, transparent: true, opacity: 0.55
    })
  };
  var seatMats = [std(0x2c3038, 0.9), std(0x2c3038, 0.9), std(0x2a9d8f, 0.9), std(0xe07a5f, 0.9), std(0x3d5a80, 0.9)];
  var mugMats = [std(0xffffff, 0.5), std(0xe63946, 0.5), std(0x264653, 0.5), std(0xf4a261, 0.5)];
  var leafMats = [
    std(0x3f8f4a, 0.9, 0, { flatShading: true }),
    std(0x2f7a3c, 0.9, 0, { flatShading: true }),
    std(0x57a85a, 0.9, 0, { flatShading: true })
  ];
  var bookMats = [0xc0392b, 0x2e86c1, 0xf1c40f, 0x27ae60, 0x8e44ad, 0xe67e22, 0x34495e, 0xecf0f1, 0x16a085]
    .map(function (c) { return std(c, 0.85); });

  // ---------- Geometry helpers ----------
  function shade(o) { o.castShadow = true; o.receiveShadow = true; return o; }
  function box(w, h, d, m, x, y, z, parent) {
    var o = shade(new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m));
    o.position.set(x, y, z);
    (parent || scene).add(o);
    return o;
  }
  function cyl(rt, rb, h, m, x, y, z, parent, seg) {
    var o = shade(new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg || 20), m));
    o.position.set(x, y, z);
    (parent || scene).add(o);
    return o;
  }
  function group(x, z, rotY, parent) {
    var g = new THREE.Group();
    g.position.set(x, 0, z);
    g.rotation.y = rotY || 0;
    (parent || scene).add(g);
    return g;
  }
  function canvas(w, h) {
    var c = document.createElement("canvas");
    c.width = w; c.height = h;
    return c;
  }
  function tex(c) {
    var t = new THREE.CanvasTexture(c);
    t.encoding = THREE.sRGBEncoding;
    t.anisotropy = renderer.capabilities.getMaxAnisotropy();
    return t;
  }

  // ---------- Canvas textures ----------
  function floorTexture() {
    var c = canvas(1024, 1024), g = c.getContext("2d");
    var rows = 8, rh = 1024 / rows, len = 512;
    for (var r = 0; r < rows; r++) {
      var off = ((r * 3) % 4) * 128;
      for (var x = -off; x < 1024; x += len) {
        var l = 58 + Math.floor(rnd() * 14);
        g.fillStyle = "hsl(32, 42%, " + l + "%)";
        g.fillRect(x, r * rh, len, rh);
        // grain
        for (var i = 0; i < 10; i++) {
          g.strokeStyle = "rgba(90, 55, 25, " + (0.05 + rnd() * 0.08) + ")";
          g.lineWidth = 1 + rnd() * 2;
          var gy = r * rh + 8 + rnd() * (rh - 16);
          g.beginPath();
          g.moveTo(x + 4, gy);
          g.bezierCurveTo(x + len * 0.3, gy + (rnd() - 0.5) * 8, x + len * 0.7, gy + (rnd() - 0.5) * 8, x + len - 4, gy);
          g.stroke();
        }
        g.fillStyle = "rgba(60, 35, 15, 0.45)";
        g.fillRect(x, r * rh, 3, rh);
      }
      g.fillStyle = "rgba(60, 35, 15, 0.45)";
      g.fillRect(0, r * rh, 1024, 3);
    }
    var t = tex(c);
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.repeat.set(W / 4, D / 4);
    return t;
  }

  function codeScreenTexture() {
    var c = canvas(256, 160), g = c.getContext("2d");
    g.fillStyle = "#1c1e2a"; g.fillRect(0, 0, 256, 160);
    g.fillStyle = "#252838"; g.fillRect(0, 0, 44, 160);
    g.fillStyle = "#2d3145"; g.fillRect(0, 0, 256, 12);
    for (var s = 0; s < 9; s++) {
      g.fillStyle = "rgba(200,210,230,0.35)";
      g.fillRect(6, 20 + s * 13, 18 + rnd() * 16, 4);
    }
    var palette = ["#c792ea", "#82aaff", "#c3e88d", "#ffcb6b", "#f78c6c", "#89ddff", "#a6accd"];
    for (var i = 0; i < 12; i++) {
      var y = 20 + i * 11.5, x = 52 + Math.floor(rnd() * 4) * 10;
      var segs = 1 + Math.floor(rnd() * 4);
      for (var k = 0; k < segs && x < 245; k++) {
        var w = 10 + rnd() * 40;
        g.fillStyle = pick(palette);
        g.fillRect(x, y, Math.min(w, 248 - x), 4);
        x += w + 5;
      }
    }
    return tex(c);
  }

  function dashScreenTexture() {
    var c = canvas(256, 160), g = c.getContext("2d");
    g.fillStyle = "#f3f5f9"; g.fillRect(0, 0, 256, 160);
    g.fillStyle = "#2f6fdb"; g.fillRect(0, 0, 256, 14);
    var colors = ["#2f6fdb", "#2a9d8f", "#e9c46a", "#e07a5f"];
    g.fillStyle = "#ffffff"; g.fillRect(8, 22, 150, 128);
    for (var b = 0; b < 8; b++) {
      var h = 20 + rnd() * 90;
      g.fillStyle = colors[b % 4];
      g.fillRect(18 + b * 17, 142 - h, 11, h);
    }
    for (var p = 0; p < 3; p++) {
      g.fillStyle = "#ffffff"; g.fillRect(166, 22 + p * 44, 82, 38);
      g.fillStyle = colors[p]; g.fillRect(174, 32 + p * 44, 30 + rnd() * 30, 6);
      g.fillStyle = "#c9ced8"; g.fillRect(174, 44 + p * 44, 60, 4);
    }
    return tex(c);
  }

  function slideTexture() {
    var c = canvas(512, 288), g = c.getContext("2d");
    g.fillStyle = "#f7f8fb"; g.fillRect(0, 0, 512, 288);
    g.fillStyle = "#1d2733"; g.font = "bold 30px Segoe UI, Arial, sans-serif";
    g.fillText("Sprint review", 28, 50);
    g.fillStyle = "#8a94a3"; g.font = "18px Segoe UI, Arial, sans-serif";
    g.fillText("Features shipped per week", 28, 80);
    var colors = ["#2f6fdb", "#2a9d8f", "#e9c46a", "#e07a5f"];
    for (var i = 0; i < 10; i++) {
      var h = 40 + i * 12 + rnd() * 30;
      g.fillStyle = colors[i % 4];
      g.fillRect(36 + i * 44, 262 - h, 30, h);
    }
    return tex(c);
  }

  function whiteboardTexture() {
    var c = canvas(512, 280), g = c.getContext("2d");
    g.fillStyle = "#fbfbfb"; g.fillRect(0, 0, 512, 280);
    g.lineWidth = 4; g.lineCap = "round";
    var inks = ["#2f6fdb", "#d62828", "#2a9d8f", "#222"];
    // boxes and arrows like a flow sketch
    var boxes = [[40, 40], [200, 40], [360, 40], [120, 170], [290, 170]];
    boxes.forEach(function (bx, i) {
      g.strokeStyle = inks[i % 4];
      g.strokeRect(bx[0], bx[1], 110, 60);
      g.beginPath();
      g.moveTo(bx[0] + 15, bx[1] + 30);
      g.lineTo(bx[0] + 60 + rnd() * 30, bx[1] + 30);
      g.stroke();
    });
    g.strokeStyle = "#222";
    [[150, 70, 200, 70], [310, 70, 360, 70], [255, 100, 190, 170], [255, 100, 330, 170]].forEach(function (l) {
      g.beginPath(); g.moveTo(l[0], l[1]); g.lineTo(l[2], l[3]); g.stroke();
    });
    return tex(c);
  }

  function skyTexture() {
    var c = canvas(64, 128), g = c.getContext("2d");
    var gr = g.createLinearGradient(0, 0, 0, 128);
    gr.addColorStop(0, "#6f7fb8");
    gr.addColorStop(0.45, "#f0a07a");
    gr.addColorStop(1, "#ffd9a0");
    g.fillStyle = gr; g.fillRect(0, 0, 64, 128);
    return tex(c);
  }

  var screenTextures = [];
  for (var s = 0; s < 6; s++) screenTextures.push(codeScreenTexture());
  for (var s2 = 0; s2 < 3; s2++) screenTextures.push(dashScreenTexture());
  var skyMat = screenMat(skyTexture());

  // ---------- Lights (warm, late-afternoon + lamps) ----------
  scene.add(new THREE.HemisphereLight(lin(0xffe2c2), lin(0x6e4c36), 0.55));
  scene.add(new THREE.AmbientLight(lin(0xffd6b0), 0.08));
  var sun = new THREE.DirectionalLight(lin(0xffb877), 1.55);
  sun.position.set(18, 12, 9);
  sun.target.position.set(3, 0, 0);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.camera.left = -22;
  sun.shadow.camera.right = 22;
  sun.shadow.camera.top = 22;
  sun.shadow.camera.bottom = -22;
  sun.shadow.camera.near = 1;
  sun.shadow.camera.far = 80;
  sun.shadow.bias = -0.0005;
  sun.shadow.normalBias = 0.02;
  scene.add(sun);
  scene.add(sun.target);

  function warmLight(x, y, z, intensity, dist) {
    var l = new THREE.PointLight(lin(0xffae5c), intensity, dist, 1.6);
    l.position.set(x, y, z);
    scene.add(l);
    return l;
  }
  warmLight(5.3, 1.5, -8.0, 1.8, 6.5);    // lounge floor lamp
  warmLight(8.3, 2.3, -7.9, 0.9, 6);      // string lights
  warmLight(-1, 1.5, -8.0, 1.3, 5.5);     // kitchen under-cabinet
  warmLight(-8.5, 2.2, -6, 1.3, 6.5);     // meeting room
  [-7.4, -3.0, 1.4, 5.8].forEach(function (px) { warmLight(px, 2.1, 2.3, 1.0, 6.5); }); // desk lamps glow

  // ---------- Navigation data (filled by the furniture builders) ----------
  var obstacles = [];   // [minX, maxX, minZ, maxZ]
  var spots = [];       // places NPCs can go and do things
  var deskHits = [], deskHitGeo = new THREE.BoxGeometry(1.6, 1.4, 0.8), deskHitMat = new THREE.MeshBasicMaterial();
  function addObs(cx, cz, w, d, rot) {
    if (rot && Math.abs(Math.sin(rot)) > 0.5) { var t = w; w = d; d = t; }
    obstacles.push([cx - w / 2, cx + w / 2, cz - d / 2, cz + d / 2]);
  }
  // a = facing angle (0 faces +z), h = seat height (0 = standing), app = distance of the approach point behind the spot
  function addSpot(kind, x, z, a, h, app, owner) {
    spots.push({ kind: kind, x: x, z: z, a: a, h: h, owner: owner || null,
      ax: x - Math.sin(a) * app, az: z - Math.cos(a) * app, taken: null });
  }

  // ---------- Floor ----------
  var floorMat = new THREE.MeshStandardMaterial({ map: floorTexture(), roughness: 0.7 });
  var floor = new THREE.Mesh(
    new THREE.BoxGeometry(W, 0.3, D),
    [mat.floorEdge, mat.floorEdge, floorMat, mat.floorEdge, mat.floorEdge, mat.floorEdge]
  );
  floor.position.set(FLOOR_CX, -0.15, 0);
  floor.receiveShadow = true;
  scene.add(floor);

  function floorPatch(w, d, m, x, z, y) {
    var p = new THREE.Mesh(new THREE.PlaneGeometry(w, d), m);
    p.rotation.x = -Math.PI / 2;
    p.position.set(x, y || 0.006, z);
    p.receiveShadow = true;
    scene.add(p);
    return p;
  }
  floorPatch(18, 7.8, mat.carpet, -0.8, 2.3);          // workspace carpet
  floorPatch(7, 6, mat.meetCarpet, -8.5, -6);          // meeting room carpet
  floorPatch(4.6, 3.2, mat.rug, 8, -6.6, 0.008);       // lounge rug

  // ---------- Walls ----------
  box(W + 0.2, WALL_H, 0.2, mat.wall, FLOOR_CX - 0.1, WALL_H / 2, -HZ - 0.1);   // back wall
  box(0.2, WALL_H, 16.65, mat.wall, -HX - 0.1, WALL_H / 2, -0.675);   // left wall, up to the front door
  box(0.2, WALL_H, 0.25, mat.wall, -HX - 0.1, WALL_H / 2, 8.875);      // left wall, past the door
  box(0.2, 0.76, 1.1, mat.wall, -HX - 0.1, 2.62, 8.2);                 // above the door
  box(1.4, 0.3, 1.6, mat.floorEdge, -HX - 0.9, -0.15, 8.2);            // outside step
  box(W, 0.1, 0.03, mat.baseboard, FLOOR_CX, 0.05, -HZ + 0.015);
  box(0.03, 0.1, 16.65, mat.baseboard, -HX + 0.015, 0.05, -0.675);

  function makeWindow(x, z, rotY, w, h, y) {
    var g = group(x, z, rotY);
    box(w + 0.12, h + 0.12, 0.05, mat.frame, 0, y, 0.025, g);

      var b = buckets.get(o.material);

  var CELL = 0.2, GW = Math.round(W / CELL), GD = Math.round(D / CELL), BODY_R = 0.22;

  (function buildGrid() {
    for (var j = 0; j < GD; j++) {
      for (var i = 0; i < GW; i++) {
        var x = XMIN + (i + 0.5) * CELL, z = -HZ + (j + 0.5) * CELL, b = 0;
        if (x < XMIN + 0.3 || x > XMAX - 0.3 || z < -HZ + 0.3 || z > HZ - 0.3) b = 1;

  function cellIndex(x, z) {
    var i = Math.floor((x - XMIN) / CELL), j = Math.floor((z + HZ) / CELL);

    if (j < 0) j = 0; if (j >= GD) j = GD - 1;

  }

  function nearestFree(idx) {

    stampA[idx] = stampNo;
    while (head < queue.length) {
      var c = queue[head++], ci = c % GW, cj = Math.floor(c / GW);
      var nb = [[1, 0], [-1, 0], [0, 1], [0, -1]];
      for (var k = 0; k < 4; k++) {
        var ni = ci + nb[k][0], nj = cj + nb[k][1];
        if (ni < 0 || nj < 0 || ni >= GW || nj >= GD) continue;
        var n = nj * GW + ni;
        if (stampA[n] === stampNo) continue;
        if (!blocked[n]) return n;
        stampA[n] = stampNo;

    heapI.push(i); heapF.push(f);

      if (heapF[p] <= heapF[c]) break;
      var ti = heapI[p]; heapI[p] = heapI[c]; heapI[c] = ti;
      var tf = heapF[p]; heapF[p] = heapF[c]; heapF[c] = tf;
      c = p;

    if (heapI.length) {

  }

  // ---------- Isometric camera ----------

  function openShop(scrollToHire) {
    var wr = hudEl && hudEl.getBoundingClientRect ? hudEl.getBoundingClientRect() : null;
    if (wr && wr.bottom && document.documentElement) document.documentElement.style.setProperty("--hud-bottom", Math.round(wr.bottom) + "px");
    shopEl.hidden = false;
    walletBtn.setAttribute("aria-expanded", "true");
    upgBtn.setAttribute("aria-expanded", "true");
    refreshShop(true);
    if (scrollToHire && hireBox.scrollIntoView) hireBox.scrollIntoView({ block: "nearest" });
  }
  function closeShop() {
    if (shopEl.hidden) return false;
    shopEl.hidden = true;
    walletBtn.setAttribute("aria-expanded", "false");
    upgBtn.setAttribute("aria-expanded", "false");
    return true;
  }
  buildShop();
  function toggleShop() { if (shopEl.hidden) openShop(false); else closeShop(); }
  walletBtn.addEventListener("click", toggleShop);
  upgBtn.addEventListener("click", toggleShop);
  document.getElementById("shopClose").addEventListener("click", function () { closeShop(); upgBtn.focus(); });

  function makeChip(n) {
    var el = document.createElement("div");
    el.className = "chip";
    el.innerHTML = '<svg viewBox="0 0 20 20" aria-hidden="true"><circle class="trk" cx="10" cy="10" r="7.5"></circle>' +
      '<circle class="val" cx="10" cy="10" r="7.5"></circle></svg>';
    chipLayer.appendChild(el);
    n.chip = { el: el, ring: el.querySelector(".val"), b: -1, cls: "", shown: true };
  }
  function updateChips() {
    for (var i = 0; i < npcs.length; i++) {
      var n = npcs[i];
      if (n.info.ceo) continue;
      var seated = isSeatedAtDesk(n);
      var show = (seated || n.burnout > 0.03) && n !== talkingNPC;
      var p = show ? screenOf(n, 0.36) : null;
      if (p && !onScreen(p)) show = false;
      if (!show) {
        if (n.chip && n.chip.shown) { n.chip.el.style.display = "none"; n.chip.shown = false; }
        continue;
      }
      if (!n.chip) makeChip(n);
      var c = n.chip;
      if (!c.shown) { c.el.style.display = ""; c.shown = true; }
      if (Math.abs(c.b - n.burnout) > 0.004) {
        c.b = n.burnout;
        c.ring.style.strokeDashoffset = (47.12 * (1 - n.burnout)).toFixed(2);
      }
      var cls = "chip" + (n.burnout > 0.8 ? " hot" : n.burnout > 0.5 ? " warn" : "") + (n.focusT > 0 ? " focus" : "") + (seated && !n.burnedOut ? "" : " off");
      if (cls !== c.cls) { c.el.className = cls; c.cls = cls; }
      var w = c.el.offsetWidth || 26, h = c.el.offsetHeight || 26;
      c.el.style.transform = "translate(" + Math.round(p.x - w / 2) + "px," + Math.round(p.y - h) + "px)";
    }
  }
  function updateOverlays(dt) {
    for (var i = pops.length - 1; i >= 0; i--) {
      pops[i].ttl -= dt;
      if (pops[i].ttl <= 0) { pops[i].el.remove(); pops.splice(i, 1); }
    }
    updateChips();
    tickT += dt;
    if (tickT >= TICK_SECONDS) { tickT -= TICK_SECONDS; payTick(); }
    hudT -= dt;
    if (hudT <= 0) {
      hudT = 0.1;
      var rate = 0, workers = 0;
      for (var k = 0; k < npcs.length; k++) {
        if (isWorking(npcs[k])) { workers++; rate += effRate(npcs[k]) * (npcs[k].focusT > 0 ? 1.5 : 1); }
      }
      cashEl.textContent = fmtGame(cash);
      rateEl.textContent = fmtGame(rate);
      workersEl.textContent = workers;
      refreshShop(false);
      tickBar.style.width = (tickT / TICK_SECONDS * 100).toFixed(1) + "%";
      var left = Math.max(1, Math.ceil(TICK_SECONDS - tickT));
      if (left !== lastLeft) { tickLabel.textContent = "PAYDAY " + left + "s"; lastLeft = left; }
      upgBtn.classList.toggle("ready", anythingAffordable());
    }
    saveT += dt;
    if (saveT > 4) { saveT = 0; saveCash(); }
    // door opens for anyone right at it
    var near = 0;
    for (var d = 0; d < npcs.length; d++) {
      var m = npcs[d];
      if (m.state === "arrive" || (Math.abs(m.x - (-HX)) < 1.3 && Math.abs(m.z - DOOR_Z) < 0.9)) { near = 1; break; }
    }
    doorOpen += (near - doorOpen) * Math.min(1, dt * 4);
    doorPivot.rotation.y = doorOpen * 1.45;
  }

  function placeBubble() {
    var n = talkingNPC;
    if (!n) return;
    talkRing.position.set(n.x, 0.012, n.z);
    n.head.getWorldPosition(headPos);
    headPos.y += 0.42;
    headPos.project(camera);
    var vw = window.innerWidth, vh = window.innerHeight;
    var x = (headPos.x + 1) / 2 * vw, y = (1 - headPos.y) / 2 * vh;
    var bw = bubbleEl.offsetWidth || 290, bh = bubbleEl.offsetHeight || 120, m = 12;
    var cx = Math.max(bw / 2 + m, Math.min(vw - bw / 2 - m, x));
    var cy = Math.max(bh + m + 12, Math.min(vh - m, y));
    bubbleEl.style.setProperty("--tail", Math.max(-bw / 2 + 22, Math.min(bw / 2 - 22, x - cx)) + "px");
    bubbleWrap.style.transform = "translate(" + Math.round(cx - bw / 2) + "px," + Math.round(cy - bh - 12) + "px)";
  }

  // Keyboard panning
  var keys = new Set();
  var KEYMAP = {
    KeyW: "up", ArrowUp: "up", KeyS: "down", ArrowDown: "down",
    KeyA: "left", ArrowLeft: "left", KeyD: "right", ArrowRight: "right"
  };
  window.addEventListener("keydown", function (e) {
    if (e.key === "Escape") { if (!closeShop()) closeTalk(); return; }
    if (KEYMAP[e.code]) { keys.add(KEYMAP[e.code]); e.preventDefault(); }
    else if (e.key === "+" || e.key === "=") zoomCenter(1.2);
    else if (e.key === "-" || e.key === "_") zoomCenter(1 / 1.2);
  });
  window.addEventListener("keyup", function (e) { if (KEYMAP[e.code]) keys.delete(KEYMAP[e.code]); });
  window.addEventListener("blur", function () { keys.clear(); });

  var SCREEN_RIGHT = new THREE.Vector3(1, 0, -1).normalize();
  var SCREEN_UP = new THREE.Vector3(-1, 0, -1).normalize();

  function zoomCenter(f) { zoomAt(camera.zoom * f, window.innerWidth / 2, window.innerHeight / 2); }
  document.getElementById("zoomIn").addEventListener("click", function () { zoomCenter(1.25); });
  document.getElementById("zoomOut").addEventListener("click", function () { zoomCenter(1 / 1.25); });
  document.getElementById("reset").addEventListener("click", function () {
    target.set(2, 0, 0);
    camera.zoom = initialZoom();
    camera.updateProjectionMatrix();
    updateCamera();
  });

  window.addEventListener("resize", resize);

  // ---------- Loop ----------
  resize();
  updateCamera();
  var clock = new THREE.Clock();
  function frame() {
    var dt = Math.min(clock.getDelta(), 0.05);
    if (keys.size) {
      var speed = (10 / camera.zoom) * dt;
      var mx = 0, my = 0;
      if (keys.has("right")) mx += 1;
      if (keys.has("left")) mx -= 1;
      if (keys.has("up")) my += 1;
      if (keys.has("down")) my -= 1;
      target.addScaledVector(SCREEN_RIGHT, mx * speed);
      target.addScaledVector(SCREEN_UP, my * speed * 1.4);
      clampTarget();
      updateCamera();
    }
    for (var q = 0; q < npcs.length; q++) { updateNPC(npcs[q], dt); economyTick(npcs[q], dt); }
    for (var fi = 0; fi < fishes.length; fi++) {
      var fsh = fishes[fi];
      fsh.ph += dt * fsh.sp;
      fsh.m.position.z = -6.4 + Math.sin(fsh.ph) * fsh.amp;
      fsh.m.position.y = fsh.y + Math.sin(fsh.ph * 2.3) * 0.03;
      fsh.m.rotation.y = Math.cos(fsh.ph) >= 0 ? 0 : Math.PI;
    }
    placeBubble();
    updateShouts(dt);
    updateOverlays(dt);
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Replay chess games from PGN with animated moves, sound and a Stockfish game review.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%E2%99%9E%3C/text%3E%3C/svg%3E">
<title>PGN Replay Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: board (eval bar + coordinate strips) on the left, review / controls / moves side panel on the right; stacks under 900px */
:root{
  --bg:#edf0ee; --surface:#ffffff; --surface-2:#f4f6f5; --ink:#1c2420; --muted:#5d6a65; --line:#d3dad7;
  --accent:#2e6b5b; --accent-ink:#ffffff;
  --sq-light:#e9dfca; --sq-dark:#8c9c7d; --sq-hl:rgba(236,196,64,.55);
  --coord-bg:#26302c; --coord-fg:#e9dfca;
  --eval-white:#f4f1ea; --eval-black:#2a302d;
  --c-great:#2f74c0; --c-best:#2f8a58; --c-excellent:#5c9a2e; --c-good:#7b8f76;
  --c-inacc:#c4930f; --c-mistake:#d4701f; --c-miss:#b4417f; --c-blunder:#c3332e;
  --arrow-best:#1f8a4c;
  --font-ui:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --radius:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#151a18; --surface:#1d2421; --surface-2:#242c29; --ink:#e4ebe7; --muted:#9aa8a2; --line:#323c38;
  --accent:#6fb59f; --accent-ink:#0f1513; --coord-bg:#d9cfb8; --coord-fg:#1d2421;
  --eval-white:#e8e4da; --eval-black:#0e1210;
  --c-great:#5e9fe6; --c-best:#4fbf80; --c-excellent:#8cc55a; --c-good:#9fb09a;
  --c-inacc:#e2b93c; --c-mistake:#ef9348; --c-miss:#e070ad; --c-blunder:#ef5d57; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#151a18; --surface:#1d2421; --surface-2:#242c29; --ink:#e4ebe7; --muted:#9aa8a2; --line:#323c38;
  --accent:#6fb59f; --accent-ink:#0f1513; --coord-bg:#d9cfb8; --coord-fg:#1d2421;
  --eval-white:#e8e4da; --eval-black:#0e1210;
  --c-great:#5e9fe6; --c-best:#4fbf80; --c-excellent:#8cc55a; --c-good:#9fb09a;
  --c-inacc:#e2b93c; --c-mistake:#ef9348; --c-miss:#e070ad; --c-blunder:#ef5d57; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:20px 40px}
.wrap{max-width:1160px;margin:0 auto;display:flex;flex-direction:column;gap:16px;outline:none}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 20px}
h1{font-size:1.45rem;margin:0;letter-spacing:-.01em;text-wrap:balance}
.sub{color:var(--muted);margin:0;font-size:.9rem}
.main{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,390px);gap:22px;align-items:start}
@media (max-width:900px){.main{grid-template-columns:minmax(0,1fr)}}
.credits{border-top:1px solid var(--line);padding-top:10px;color:var(--muted);font-size:.78rem;line-height:1.5}
.credits a{color:inherit;text-decoration:underline;text-underline-offset:2px}
.credits a:hover{color:var(--ink)}

/* ---- left: board ---- */
.left{display:flex;flex-direction:column;gap:8px;min-width:0;max-width:700px;width:100%}
.player{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:600;font-size:.95rem}
.player .elo{font-family:var(--font-mono);color:var(--muted);font-weight:400;font-size:.85rem}
.player .tag{font-size:.75rem;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--surface);color:var(--muted);border:1px solid var(--line)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;border:1px solid var(--muted);vertical-align:middle}
.boardwrap{display:grid;grid-template-columns:clamp(16px,3.4vw,26px) 8px clamp(18px,3.4vw,26px) minmax(0,1fr);grid-template-rows:auto clamp(18px,3.4vw,26px)}
.evalv{grid-column:1;grid-row:1;position:relative;background:var(--eval-black);border-radius:5px;overflow:hidden;border:1px solid var(--line)}
.evalv i{position:absolute;left:0;right:0;bottom:0;height:50%;background:var(--eval-white);transition:height .35s ease}
.evalv.flip i{bottom:auto;top:0}
.evalv b{position:absolute;left:0;right:0;text-align:center;font-family:var(--font-mono);font-size:clamp(7px,1.3vw,10px);font-weight:600;line-height:1;padding:5px 0}
.ranks{grid-column:3;grid-row:1;display:grid;grid-template-rows:repeat(8,1fr);background:var(--coord-bg);border-radius:6px 0 0 0}
.files{grid-column:4;grid-row:2;display:grid;grid-template-columns:repeat(8,1fr);background:var(--coord-bg);border-radius:0 0 6px 0}
.corner{grid-column:3;grid-row:2;background:var(--coord-bg);border-radius:0 0 0 6px}
.ranks span,.files span{display:flex;align-items:center;justify-content:center;color:var(--coord-fg);font-family:var(--font-mono);font-weight:600;font-size:clamp(.7rem,1.6vw,.85rem)}
.board{grid-column:4;grid-row:1;position:relative;width:100%;aspect-ratio:1;overflow:hidden;border-radius:0 6px 0 0;container-type:inline-size;user-select:none}
.sq{position:absolute;width:12.5%;height:12.5%}
.sq.l{background:var(--sq-light)} .sq.d{background:var(--sq-dark)}
.sq.hl::after{content:"";position:absolute;inset:0;background:var(--sq-hl)}
.pc{position:absolute;width:12.5%;height:12.5%;display:flex;align-items:center;justify-content:center;font-size:9.6cqw;line-height:1;
  font-family:"Segoe UI Symbol","DejaVu Sans","Noto Sans Symbols2","Apple Symbols",serif;transition:left .24s ease,top .24s ease,opacity .2s;z-index:2}
.pc.w{color:#fbf8f0;text-shadow:0 0 1px #111,0 0 1px #111,1px 1px 0 #111,-1px -1px 0 #111,1px -1px 0 #111,-1px 1px 0 #111}
.pc.b{color:#191d1b;text-shadow:0 0 1px rgba(255,255,255,.35)}
.pc.moving{z-index:3} .pc.gone{opacity:0}
.mark{position:absolute;width:12.5%;height:12.5%;z-index:6;pointer-events:none;display:flex;justify-content:flex-end;align-items:flex-start;padding:1.5%}
.mark span{font-family:var(--font-ui);font-weight:700;font-size:2.5cqw;color:#fff;min-width:4.2cqw;height:4.2cqw;border-radius:99px;display:flex;align-items:center;justify-content:center;padding:0 .8cqw;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.arrows{position:absolute;inset:0;width:100%;height:100%;z-index:5;pointer-events:none}

/* ---- right: side panel ---- */
.side{display:flex;flex-direction:column;gap:14px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel h2{font-size:.76rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0}
button,select{font:inherit;font-size:.9rem;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 12px;cursor:pointer}
button:hover{border-color:var(--muted)}
button:focus-visible,select:focus-visible,textarea:focus-visible,.mv:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.5;cursor:default}
.review-btn{position:relative;overflow:hidden;width:100%;padding:12px;font-size:1rem;font-weight:700;background:var(--accent);color:var(--accent-ink);border-color:var(--accent);white-space:nowrap;text-overflow:ellipsis}
.review-btn .prog{position:absolute;left:0;bottom:0;height:4px;width:0;background:var(--accent-ink);opacity:.6;transition:width .2s}
.review-btn:disabled{opacity:1;cursor:progress}
.counts{display:grid;grid-template-columns:minmax(0,1fr) 6em 6em;gap:2px 8px;align-items:center;font-variant-numeric:tabular-nums}
.counts .h{font-size:.78rem;color:var(--muted);text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.counts .cat{display:flex;align-items:center;gap:9px;font-weight:600;padding:5px 0}
.counts .n{text-align:center;font-family:var(--font-mono);font-weight:600;font-size:1.05rem}
.ico{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;border-radius:99px;color:#fff;font-size:.72rem;font-weight:700;padding:0 4px;flex:none}
.cur{border-top:1px solid var(--line);padding-top:10px;font-size:.9rem;height:2.4em;box-sizing:content-box;overflow:hidden}
.cur .row{display:flex;align-items:center;gap:8px;height:100%;white-space:nowrap;min-width:0}
.cur .row b{overflow:hidden;text-overflow:ellipsis}
.cur .muted{color:var(--muted)}
.cur b{font-family:var(--font-mono)}
.sw{display:inline-block;width:16px;height:5px;border-radius:3px;vertical-align:middle;margin-right:4px}
.sw.best{background:var(--arrow-best)}

.nav{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.nav button{font-family:var(--font-mono);padding:9px 0;font-size:1rem}
.nav #bPlay{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.keys{font-size:.8rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px}
kbd{font-family:var(--font-mono);font-size:.75rem;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--surface-2);color:var(--ink)}
.opts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.opts label{display:flex;align-items:center;gap:6px;font-size:.88rem;cursor:pointer}

.moves{height:300px;overflow:auto;display:grid;grid-template-columns:2.4em 1fr 1fr;gap:1px 2px;font-family:var(--font-mono);font-size:.9rem;align-content:start;margin:-4px -6px}
.moves .no{color:var(--muted);text-align:right;padding:4px 6px 4px 0}
.mv{border:0;background:none;text-align:left;padding:4px 8px;border-radius:6px;font-family:var(--font-mono);font-size:.9rem;display:flex;gap:6px;align-items:center;min-width:0;color:var(--ink)}
.mv:hover{background:var(--surface-2)}
.mv.on{background:var(--accent);color:var(--accent-ink)}
.mv .b{font-weight:700;font-size:.8rem}
.mv.on .b{color:inherit!important}

details.load summary{cursor:pointer;font-weight:600}
details.load[open] summary{margin-bottom:10px}
textarea{width:100%;min-height:140px;font-family:var(--font-mono);font-size:.8rem;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surface-2);color:var(--ink);resize:vertical}
.loadrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.loadrow .primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.err{color:var(--c-blunder);font-size:.86rem}
@media (prefers-reduced-motion:reduce){.pc,.evalv i,.review-btn .prog{transition:none}}
</style>
</head>
<body>


<div class="wrap" id="app" tabindex="-1">
  <header>
    <h1>PGN Replay Board</h1>
    <p class="sub" id="gameMeta">Loading game…</p>
  </header>

  <div class="main">
    <div class="left">
      <details class="panel load" id="loadBox">
        <summary>Load game</summary>
        <textarea id="pgnInput" spellcheck="false" placeholder="Paste a PGN from Chess.com or Lichess here"></textarea>
        <div class="loadrow">
          <button class="primary" id="loadBtn">Load game</button>
          <button id="sampleBtn">Sample game</button>
          <span class="err" id="loadErr" hidden></span>
        </div>
      </details>
      <div class="player" id="topPlayer"></div>
      <div class="boardwrap">
        <div class="evalv" id="evalv" title="Evaluation"><i id="evalFill"></i><b id="evalTxt"></b></div>
        <div class="ranks" id="ranks"></div>
        <div class="board" id="board" aria-label="Chess board"></div>
        <div class="corner"></div>
        <div class="files" id="files"></div>
      </div>
      <div class="player" id="botPlayer"></div>
    </div>

    <div class="side">
      <section class="panel">
        <h2>Game Review</h2>
        <button class="review-btn" id="bReview"><span id="reviewLbl">Review game</span><span class="prog" id="reviewProg"></span></button>
        <div class="counts" id="counts"></div>
        <div class="cur" id="cur"></div>
      </section>

      <section class="panel">
        <div class="nav">
          <button id="bStart" aria-label="Go to start" title="Start (↑)">⏮</button>
          <button id="bPrev" aria-label="Previous move" title="Back (←)">◀</button>
          <button id="bPlay" aria-label="Play" title="Play (Space)">▶</button>
          <button id="bNext" aria-label="Next move" title="Forward (→)">▶</button>
          <button id="bEnd" aria-label="Go to end" title="End (↓)">⏭</button>
        </div>
        <div class="keys"><span><kbd>←</kbd> <kbd>→</kbd> move</span><span><kbd>↑</kbd> <kbd>↓</kbd> start / end</span><span><kbd>Space</kbd> play</span></div>
        <div class="opts">
          <select id="speed" aria-label="Playback speed">
            <option value="1600">Slow</option>
            <option value="900" selected>Normal</option>
            <option value="450">Fast</option>
          </select>
          <button id="bFlip">Flip</button>
          <button id="bSound" aria-pressed="true">🔊 Sound</button>
          <label><input type="checkbox" id="showArrows" checked> Arrows</label>
        </div>
      </section>

      <section class="panel">
        <h2>Moves</h2>
        <div class="moves" id="moves"></div>
      </section>
    </div>
  </div>

  <footer class="credits">
    Game review powered by <a href="https://github.com/official-stockfish/Stockfish" target="_blank" rel="noopener">Stockfish</a> (GPLv3) via <a href="https://github.com/nmrugg/stockfish.js" target="_blank" rel="noopener">stockfish.js</a> · Move logic by <a href="https://github.com/jhlywa/chess.js" target="_blank" rel="noopener">chess.js</a> (BSD-2)
  </footer>
</div>

<script src="chess.js"></script>
<script>
const SAMPLE = `[Event "Live Chess"]
[Site "Chess.com"]
[Date "2026.10.10"]
[White "gogo38450"]
[Black "Velocity7"]
[Result "0-1"]
[TimeControl "180+2"]
[WhiteElo "446"]
[BlackElo "472"]
[Termination "Velocity7 won on time"]

1. e3 Nf6 2. d4 d6 3. Nc3 g6 4. e4 e6 5. Qe2 Bg7 6. d5 e5 7. Bg5 O-O 8. Qb5 Bd7
9. Qxb7 Nc6 10. dxc6 Be6 11. Nf3 Qe7 12. Nd2 Rab8 13. Qxa7 Ra8 14. Qb7 Rfb8 15.
Bxf6 Bxf6 16. Nd5 Bxd5 17. Qxb8+ Rxb8 18. exd5 Rxb2 19. Bd3 Rb4 20. O-O Bg5 21.
Rab1 Rd4 22. Nf3 Ra4 23. Rb8+ Kg7 24. h4 Bh6 25. g4 Bf4 26. g5 Rxa2 27. Ne1 Bd2
28. Nf3 Bc3 29. Rbb1 Ra4 30. Ra1 Bxa1 31. Nd2 Bc3 32. Nb1 Ra1 33. Nxc3 Rxf1+ 34.
Kxf1 f6 35. gxf6+ Qxf6 36. Nb5 Qxh4 37. Nxc7 Qh1+ 38. Ke2 Qh5+ 39. Kf1 Qf3 40.
Be2 Qc3 41. Ne8+ Kh6 42. Nxd6 Qxc2 43. Nf7+ Kg7 44. Nxe5 Qc1+ 45. Kg2 Kf6 46. d6
Qb2 0-1`;

// Move categories. "counted" ones appear in the review totals.
const CAT = {
  great:     {label:"Great",      glyph:"!",  counted:true},
  best:      {label:"Best",       glyph:"★"},
  excellent: {label:"Excellent",  glyph:"✓",  counted:true},
  good:      {label:"Good",       glyph:""},
  inacc:     {label:"Inaccuracy", glyph:"?!"},
  mistake:   {label:"Mistake",    glyph:"?"},
  miss:      {label:"Miss",       glyph:"✕",  counted:true},
  blunder:   {label:"Blunder",    glyph:"??", counted:true}
};
const COUNTED = ["great","excellent","miss","blunder"];
const REVIEW_DEPTH = 12;

const GLYPH = {k:"♚",q:"♛",r:"♜",b:"♝",n:"♞",p:"♟"};
const $ = id => document.getElementById(id);
const boardEl = $("board");

let S = {};
let flipped = false, idx = 0, playTimer = null, animTimer = null;

function parseGame(text){
  const g = new Chess();
  if(!g.load_pgn(text.trim().replace(/\r/g,""), {sloppy:true})) return null;
  const headers = g.header(), hist = g.history({verbose:true});
  if(!hist.length) return null;
  const c = new Chess(); if(headers.FEN) c.load(headers.FEN);
  const fens = [c.fen()];
  for(const m of hist){ c.move(m.san, {sloppy:true}); fens.push(c.fen()); }
  return {headers, hist, fens};
}
function loadGame(text){
  const p = parseGame(text); if(!p) return false;
  stopPlay(); cancelReview();
  const n = p.fens.length;
  S = {...p, evals:new Array(n).fill(null), second:new Array(n).fill(null), best:new Array(n).fill(null), cls:{}, reviewed:false};
  idx = 0;
  const h = p.headers;
  $("gameMeta").textContent = [h.White && h.Black ? `${h.White} vs ${h.Black}` : null, h.TimeControl ? fmtTC(h.TimeControl) : null,
    h.Date && h.Date.indexOf("?")<0 ? h.Date.replace(/\./g,"-") : null, h.Termination || h.Result].filter(Boolean).join(" · ");
  setReviewBtn("Review game", 0, false);
  buildMoveList(); renderCounts();
  go(0, false);
  return true;
}
function fmtTC(tc){ const m = tc.match(/^(\d+)(?:\+(\d+))?$/); if(!m) return tc; const mins = +m[1]/60; return `${mins % 1 ? mins.toFixed(1) : mins}+${m[2]||0}`; }
function esc(s){ return String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

/* ---------- board ---------- */
function sqXY(sq){ const f = sq.charCodeAt(0)-97, r = +sq[1]-1; return flipped ? {x:7-f, y:r} : {x:f, y:7-r}; }
function pos(el, sq){ const p = sqXY(sq); el.style.left = (p.x*12.5)+"%"; el.style.top = (p.y*12.5)+"%"; }
function drawSquares(){
  boardEl.innerHTML = "";
  for(let r=0;r<8;r++) for(let f=0;f<8;f++){
    const sq = String.fromCharCode(97+f)+(r+1);
    const d = document.createElement("div");
    d.className = "sq " + ((f+r)%2===0 ? "d":"l"); d.dataset.sq = sq; pos(d, sq);
    boardEl.appendChild(d);
  }
  const ranks = [8,7,6,5,4,3,2,1], files = ["a","b","c","d","e","f","g","h"];
  if(flipped){ ranks.reverse(); files.reverse(); }
  $("ranks").innerHTML = ranks.map(r=>`<span>${r}</span>`).join("");
  $("files").innerHTML = files.map(f=>`<span>${f}</span>`).join("");
  $("evalv").classList.toggle("flip", flipped);
}
function drawPieces(fen){
  boardEl.querySelectorAll(".pc,.mark,.arrows").forEach(e=>e.remove());
  const b = new Chess(fen).board();
  for(let i=0;i<8;i++) for(let j=0;j<8;j++){
    const cell = b[i][j]; if(!cell) continue;
    const sq = String.fromCharCode(97+j)+(8-i);
    const el = document.createElement("div");
    el.className = "pc "+cell.color; el.dataset.sq = sq; el.textContent = GLYPH[cell.type]+"︎";
    pos(el, sq); boardEl.appendChild(el);
  }
}
function drawHighlights(){
  boardEl.querySelectorAll(".sq.hl").forEach(e=>e.classList.remove("hl"));
  boardEl.querySelectorAll(".mark").forEach(e=>e.remove());
  drawArrows();
  if(idx===0) return;
  const m = S.hist[idx-1];
  [m.from, m.to].forEach(sq => boardEl.querySelector(`.sq[data-sq="${sq}"]`).classList.add("hl"));
  const c = S.cls[idx];
  if(c && CAT[c].glyph){
    const mk = document.createElement("div"); mk.className = "mark"; pos(mk, m.to);
    const s = document.createElement("span"); s.textContent = CAT[c].glyph; s.style.background = `var(--c-${c})`;
    mk.appendChild(s); boardEl.appendChild(mk);
  }
}
function arrowShape(u, color){
  const a = sqXY(u.slice(0,2)), b = sqXY(u.slice(2,4));
  const x1=a.x*100+50, y1=a.y*100+50, x2=b.x*100+50, y2=b.y*100+50;
  const dx=x2-x1, dy=y2-y1, len=Math.hypot(dx,dy); if(!len) return "";
  const ux=dx/len, uy=dy/len, px=-uy, py=ux, w=8, hw=22, hl=34, start=20, tip=8;
  const tx=x2-ux*tip, ty=y2-uy*tip, sx=x1+ux*start, sy=y1+uy*start, bx=tx-ux*hl, by=ty-uy*hl;
  const pts=[[sx+px*w,sy+py*w],[bx+px*w,by+py*w],[bx+px*hw,by+py*hw],[tx,ty],[bx-px*hw,by-py*hw],[bx-px*w,by-py*w],[sx-px*w,sy-py*w]];
  return `<polygon points="${pts.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ")}" fill="${color}" opacity=".82"/>`;
}
function drawArrows(){
  boardEl.querySelectorAll(".arrows").forEach(e=>e.remove());
  if(!$("showArrows").checked) return;
  let s = "";
  if(S.best[idx]) s += arrowShape(S.best[idx], "var(--arrow-best)");
  if(!s) return;

function go(i, animate){

  if(animate && i === idx+1 && !reduce){
    drawPieces(S.fens[idx]);
    const m = S.hist[idx];
    const cap = boardEl.querySelector(`.pc[data-sq="${m.to}"]`); if(cap) cap.classList.add("gone");
    if(m.flags.includes("e")){ const ep = boardEl.querySelector(`.pc[data-sq="${m.to[0]+m.from[1]}"]`); if(ep) ep.classList.add("gone"); }
    const mover = boardEl.querySelector(`.pc[data-sq="${m.from}"]`);
    requestAnimationFrame(()=>{
      if(mover){ mover.classList.add("moving"); pos(mover, m.to); }
      if(m.flags.includes("k") || m.flags.includes("q")){
        const r = m.from[1], ks = m.flags.includes("k");
        const rook = boardEl.querySelector(`.pc[data-sq="${(ks?"h":"a")+r}"]`);

function updateUI(withHl){

function fmtEvalShort(cp){

function renderCounts(){

  for(const [i,c] of Object.entries(S.cls)) if(CAT[c] && CAT[c].counted) cnt[S.hist[i-1].color][c]++;
  const done = S.reviewed;
  let html = `<span></span><span class="h" title="${esc(h.White||"White")}">${esc(h.White||"White")}</span><span class="h" title="${esc(h.Black||"Black")}">${esc(h.Black||"Black")}</span>`;

      const no = document.createElement("div"); no.className="no"; no.textContent = Math.ceil(i/2)+"."; box.appendChild(no);
      if(m.color==="b"){ const pad = document.createElement("div"); pad.className="no"; pad.textContent="…"; pad.style.textAlign="left"; box.appendChild(pad); }

const sndBuf = {};
let sndLoading = null;
function loadSounds(){
  const c = ac(); if(!c) return null;
  if(sndLoading) return sndLoading;
  sndLoading = Promise.all(Object.entries(SND_DATA).map(([k, b64]) => new Promise(res => {
    try{
      const bin = atob(b64), u8 = new Uint8Array(bin.length);
      for(let i=0;i<bin.length;i++) u8[i] = bin.charCodeAt(i);
      c.decodeAudioData(u8.buffer, b => { sndBuf[k] = b; res(); }, () => res());
    }catch(e){ res(); }
  })));
  return sndLoading;
}
["pointerdown","keydown"].forEach(ev => addEventListener(ev, () => loadSounds(), {once:true, capture:true}));
function snd(name, t, gain=1){
  const c = ac(), b = sndBuf[name]; if(!c || !b) return false;
  const s = c.createBufferSource(); s.buffer = b;
  const g = c.createGain(); g.gain.value = gain;
  s.connect(g); g.connect(c.destination); s.start(t || c.currentTime);
  return true;
}
function playMoveSound(i, soft){
  if(!soundOn) return;
  const m = S.hist && S.hist[i-1]; if(!m) return;
  const c = ac(); if(!c) return;
  loadSounds();
  const t = c.currentTime + .01;
  const mv = ((m.color === "w") !== flipped) ? "self" : "opponent"; // bottom player = "self"
  if(soft){ if(!snd(mv, t, .35)) click(c, t); return; }
  let name = mv;
  if(m.san.includes("+") || m.san.includes("#")) name = "check";
  else if(m.flags.includes("p")) name = "promote";
  else if(m.flags.includes("k") || m.flags.includes("q")) name = "castle";
  else if(m.flags.includes("c") || m.flags.includes("e")) name = sndBuf.capture ? "capture" : mv;
  if(!snd(name, t)) click(c, t);
  if(i === S.hist.length && S.headers.Result && S.headers.Result !== "*") snd("end", t + .3);
}
function playStartSound(){
  if(!soundOn) return;
  const c = ac(); if(!c) return;
  const p = loadSounds();
  if(!snd("start") && p) p.then(() => snd("start"));
}
function setSound(on){
  soundOn = on;
  const b = $("bSound"); b.textContent = on ? "🔊 Sound" : "🔇 Muted"; b.setAttribute("aria-pressed", on);
  try{ localStorage.setItem("pgnSound", on ? "on" : "off"); }catch(e){}
}
$("bSound").onclick = ()=>{ setSound(!soundOn); if(soundOn){ const c = ac(); if(c){ loadSounds(); if(!snd("self")) click(c, c.currentTime+.01); } } };
setSound(soundOn);

/* ---------- playback & keys ---------- */
function togglePlay(){ playTimer ? stopPlay() : startPlay(); }
function startPlay(){
  if(idx>=S.fens.length-1) go(0,false);
  const fromStart = idx===0;
  if(fromStart) playStartSound();
  $("bPlay").textContent = "❚❚"; $("bPlay").setAttribute("aria-label","Pause");
  const tick = ()=>{ if(idx>=S.fens.length-1){ stopPlay(); return; } go(idx+1, true); playTimer = setTimeout(tick, +$("speed").value); };
  playTimer = setTimeout(tick, fromStart ? 600 : 250);
}
function stopPlay(){ clearTimeout(playTimer); playTimer = null; $("bPlay").textContent = "▶"; $("bPlay").setAttribute("aria-label","Play"); }

$("bStart").onclick = ()=>{ stopPlay(); go(0,false); };
$("bPrev").onclick  = ()=>{ stopPlay(); go(idx-1,false); };
$("bNext").onclick  = ()=>{ stopPlay(); go(idx+1,true); };
$("bEnd").onclick   = ()=>{ stopPlay(); go(S.fens.length-1,false); };
$("bPlay").onclick  = togglePlay;
$("bFlip").onclick  = ()=>{ flipped = !flipped; drawSquares(); drawPieces(S.fens[idx]); updateUI(true); };
$("showArrows").onchange = ()=>drawArrows();
document.addEventListener("keydown", e=>{
  if(/TEXTAREA|SELECT|INPUT/.test(e.target.tagName) || e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key;
  if(k==="ArrowRight"){ e.preventDefault(); stopPlay(); go(idx+1,true); }
  else if(k==="ArrowLeft"){ e.preventDefault(); stopPlay(); go(idx-1,false); }
  else if(k==="ArrowUp" || k==="Home"){ e.preventDefault(); stopPlay(); go(0,false); }
  else if(k==="ArrowDown" || k==="End"){ e.preventDefault(); stopPlay(); go(S.fens.length-1,false); }
  else if(k===" " && e.target.tagName!=="BUTTON"){ e.preventDefault(); togglePlay(); }
});
// keep keyboard focus on the page so the arrow keys work right after clicking the board
boardEl.addEventListener("pointerdown", ()=>$("app").focus({preventScroll:true}));

/* ---------- load ---------- */
$("loadBtn").onclick = ()=>{
  const t = $("pgnInput").value, err = $("loadErr");
  if(!t.trim()){ err.textContent = "Paste a PGN first."; err.hidden = false; return; }
  if(loadGame(t)){ err.hidden = true; $("loadBox").open = false; playStartSound(); }
  else { err.textContent = "That PGN couldn't be read. Copy the full text from the site's PGN tab, including the moves."; err.hidden = false; }
};
$("sampleBtn").onclick = ()=>{ loadGame(SAMPLE); $("loadErr").hidden = true; $("loadBox").open = false; playStartSound(); };

/* ---------- engine & review ---------- */
const MATE_CP = 1000;
let engine = null, engineReady = false, pending = null, syncRes = null, reviewJob = null;
function winPct(cp){ const c = Math.max(-MATE_CP, Math.min(MATE_CP, cp)); return 50 + 50*(2/(1+Math.exp(-0.00368208*c))-1); }
function startEngine(){
  return new Promise((resolve, reject)=>{
    if(engine && engineReady) return resolve();
    try{
      // WebAssembly build when available (faster), plain JS build otherwise
      const wasm = typeof WebAssembly === "object" && WebAssembly.validate(Uint8Array.of(0,97,115,109,1,0,0,0));
      engine = new Worker(wasm ? "engine/stockfish.js" : "engine/stockfish.asm.js");
    }catch(e){ return reject(e); }
    const to = setTimeout(()=>reject(new Error("timeout")), 25000);
    engine.onerror = ev => { clearTimeout(to); reject(ev); };
    engine.onmessage = ev => {
      const line = typeof ev.data === "string" ? ev.data : "";
      if(line === "uciok"){ engine.postMessage("setoption name MultiPV value 2"); engine.postMessage("isready"); }
      else if(line === "readyok" && !engineReady){ engineReady = true; clearTimeout(to); engine.onmessage = onEngine; resolve(); }
    };
    engine.postMessage("uci");
  });
}
function parseScore(line){
  const m = line.match(/score (cp|mate) (-?\d+)/); if(!m) return null;
  if(m[1]==="cp") return +m[2];
  const n = +m[2]; return n > 0 ? 10000 - n : -(10000 + n);
}
function onEngine(ev){
  const line = String(ev.data);
  if(line === "readyok"){ if(syncRes){ const r = syncRes; syncRes = null; r(); } return; }
  if(!pending) return;
  if(line.startsWith("info") && line.includes(" score ") && !line.includes("lowerbound") && !line.includes("upperbound")){
    const mp = +((line.match(/ multipv (\d+)/) || [])[1] || 1);
    const sc = parseScore(line); if(sc == null) return;
    if(mp === 1){ pending.score = sc; const pv = line.match(/ pv (\S+)/); if(pv) pending.pv = pv[1]; }
    else if(mp === 2) pending.score2 = sc;
  } else if(line.startsWith("bestmove")){
    const p = pending; pending = null;
    const bm = line.split(" ")[1];
    p.done(p.score, p.score2, bm && bm !== "(none)" ? bm : p.pv);
  }
}
function engineSync(){ return new Promise(r => { syncRes = r; engine.postMessage("isready"); }); }
function evalPosition(fen, depth){
  return new Promise(res=>{
    const c = new Chess(fen);
    const stm = fen.split(" ")[1] === "w" ? 1 : -1;
    if(c.in_checkmate()) return res({cp:-stm*10000, cp2:null, best:null});
    if(c.in_draw() || c.in_stalemate()) return res({cp:0, cp2:null, best:null});
    pending = {score:0, score2:null, pv:null, done:(sc, sc2, bm)=>res({cp:stm*sc, cp2: sc2==null ? null : stm*sc2, best:bm})};
    engine.postMessage("position fen " + fen);
    engine.postMessage("go depth " + depth);
  });
}
function cancelReview(){ if(reviewJob){ reviewJob.cancelled = true; reviewJob = null; } pending = null; if(engine) engine.postMessage("stop"); }
function setReviewBtn(label, pct, busy){
  $("reviewLbl").textContent = label; $("reviewProg").style.width = pct + "%"; $("bReview").disabled = !!busy;
}
async function review(){
  if(reviewJob) return;
  const my = reviewJob = {cancelled:false};
  setReviewBtn("Starting engine…", 0, true); renderCur();
  try{ await startEngine(); }
  catch(e){ reviewJob = null; setReviewBtn("Engine couldn't start. Try again", 0, false); renderCur(); return; }
  engine.postMessage("stop"); await engineSync();
  if(my.cancelled) return;
  engine.postMessage("ucinewgame");
  S.cls = {}; S.reviewed = false;
  const n = S.fens.length;
  for(let i=0;i<n;i++){
    if(my.cancelled) return;
    const r = await evalPosition(S.fens[i], REVIEW_DEPTH);
    if(my.cancelled) return;
    S.evals[i] = r.cp; S.second[i] = r.cp2; S.best[i] = r.best;
    if(i>0){ classify(i); setBadge(i); }
    const pct = Math.round((i+1)/n*100);
    setReviewBtn(`Reviewing… ${pct}%`, pct, true);
    if(i===idx || i===idx+1){ drawHighlights(); drawEval(); renderCur(); }
  }
  reviewJob = null; S.reviewed = true;
  setReviewBtn("Review complete · Run again", 0, false);
  renderCounts(); drawHighlights(); drawEval(); renderCur();
}
function classify(i){
  const m = S.hist[i-1], before = S.evals[i-1], after = S.evals[i];
  if(before==null || after==null) return;
  const sgn = m.color==="w" ? 1 : -1;
  const wb = winPct(sgn*before), wa = winPct(sgn*after), drop = wb - wa;
  const bm = S.best[i-1], isBest = bm && bm.slice(0,4) === m.from+m.to;
  const prevBad = i>1 && ["mistake","blunder","miss"].includes(S.cls[i-1]);
  let c;
  if(isBest){
    // Great = the only good move: the engine's second choice was much worse
    const second = S.second[i-1];
    const recapture = i>1 && S.hist[i-2].captured && m.to === S.hist[i-2].to;
    c = (second!=null && !recapture && wb < 97 && wb - winPct(sgn*second) >= 15) ? "great" : "best";
  }
  else if(drop >= 10 && prevBad && wa >= 35) c = "miss";   // opponent erred, you didn't punish it
  else if(drop >= 20) c = "blunder";
  else if(drop >= 10) c = "mistake";
  else if(drop >= 5)  c = "inacc";
  else if(drop <= 2)  c = "excellent";
  else c = "good";
  S.cls[i] = c;
}
$("bReview").onclick = review;

/* ---------- boot ---------- */
drawSquares();
if(typeof Chess === "undefined"){ $("gameMeta").textContent = "The chess library didn't load. Check your connection and reload."; }
else { loadGame(SAMPLE); try{ $("app").focus({preventScroll:true}); }catch(e){} }
</script>
